name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GSC_CONTACT_ENCRYPTION_KEY: ${{ secrets.GSC_CONTACT_ENCRYPTION_KEY }}
      PLAYWRIGHT_STUDENT_EMAIL: ${{ secrets.PLAYWRIGHT_STUDENT_EMAIL }}
      PLAYWRIGHT_STUDENT_PASSWORD: ${{ secrets.PLAYWRIGHT_STUDENT_PASSWORD }}
      PLAYWRIGHT_PARENT_EMAIL: ${{ secrets.PLAYWRIGHT_PARENT_EMAIL }}
      PLAYWRIGHT_PARENT_PASSWORD: ${{ secrets.PLAYWRIGHT_PARENT_PASSWORD }}
      PLAYWRIGHT_COUNSELOR_EMAIL: ${{ secrets.PLAYWRIGHT_COUNSELOR_EMAIL }}
      PLAYWRIGHT_COUNSELOR_PASSWORD: ${{ secrets.PLAYWRIGHT_COUNSELOR_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unbounded select guard
        run: npm run test:selects

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and catalogue
        run: npm run test:unit

      - name: Dependency audit
        run: npm run test:audit

      - name: Build
        run: npm run build

      - name: Client-bundle secret scan
        run: npm run test:secrets

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - name: Link remote test project
        run: npx supabase link --project-ref ${{ secrets.SUPABASE_TEST_PROJECT_REF }}

      - name: Apply migrations
        run: npx supabase db push --linked --yes

      - name: Database tests
        run: npm run test:db
